<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="GrimShriek Arcade is a top-down zombie arcade game coming in late 2026 or early 2027">
    <meta name="theme-color" content="#1e1e1e">
    <title>GrimShriek Arcade — Coming Soon</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <section class="hero d-flex align-items-center text-center">
        <div class="container py-5">
          <img
            class="hero-logo img-fluid mb-4"
            src="assets/grimshriek-logo.png"
            alt="GrimShriek Arcade"
          >
          <p class="eyebrow mb-3">A top-down zombie arcade game</p>
          <span class="release-badge">Aiming for a late 2026 / early 2027 release.</span>
          <p class="platform-note mt-4 mb-0">
            Targeting browsers and Steam, with mobile ports planned for Google Play and the Apple App Store.
          </p>
        </div>
      </section>

      <section class="screenshots py-5" aria-labelledby="screenshots-heading">
        <div class="container py-lg-4">
          <div class="section-heading text-center mb-4 mb-lg-5">
            <p class="eyebrow mb-2">First look</p>
          </div>

          <div class="row g-4">
            <div class="col-lg-6">
              <figure class="shot-card h-100 mb-0">
                <img
                  class="img-fluid w-100"
                  src="assets/grimshriek-gameplay-01.png"
                  alt="GrimShriek gameplay in a haunted graveyard"
                  loading="lazy"
                >
              </figure>
            </div>
            <div class="col-lg-6">
              <figure class="shot-card h-100 mb-0">
                <img
                  class="img-fluid w-100"
                  src="assets/grimshriek-gameplay-02.png"
                  alt="GrimShriek gameplay in a spike-filled arena"
                  loading="lazy"
                >
              </figure>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="py-4 text-center">
      <div class="container">
        <p class="mb-0">© 2026 Noah Zielke. GrimShriek<sup>TM</sup> Arcade. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
